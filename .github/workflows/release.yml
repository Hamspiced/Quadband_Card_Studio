name: Publish release assets
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release-tag:
        description: Existing published release tag containing the release tooling
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ github.event.release.tag_name || inputs.release-tag }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      commit: ${{ steps.metadata.outputs.commit }}
      version: ${{ steps.metadata.outputs.version }}
      prerelease: ${{ steps.release-status.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ github.event.release.tag_name || inputs.release-tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Validate tag, version and exact commit
        id: metadata
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release-tag }}
        run: |
          python scripts/release_metadata.py --release-tag="$RELEASE_TAG" \
            --commit "$(git rev-parse HEAD)" --json --github-output "$GITHUB_OUTPUT"
      - name: Refuse missing or draft releases
        id: release-status
        env:
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
          SOURCE_COMMIT: ${{ steps.metadata.outputs.commit }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/release_assets.py --release-tag="$RELEASE_TAG" --commit "$SOURCE_COMMIT" \
            --check-release --github-output "$GITHUB_OUTPUT"
  build:
    needs: prepare
    uses: ./.github/workflows/build.yml
    with:
      build-ref: ${{ needs.prepare.outputs.commit }}
      release-tag: ${{ needs.prepare.outputs.tag }}
    permissions:
      contents: read
  publish:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.published.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: Quadband-*
          path: .build/release-downloads
          merge-multiple: false
      - name: Verify all outputs, upload managed assets, verify remote checksums
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.prepare.outputs.commit }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/release_assets.py --release-tag="$RELEASE_TAG" --commit "$SOURCE_COMMIT" \
            --artifacts .build/release-downloads --publish
      - name: Expose successful release tag
        id: published
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: printf 'tag=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
  pages:
    needs: [prepare, build, publish]
    if: needs.prepare.outputs.prerelease == 'false' && needs.publish.outputs.tag == needs.prepare.outputs.tag
    uses: ./.github/workflows/pages.yml
    with:
      release-tag: ${{ needs.prepare.outputs.tag }}
      source-commit: ${{ needs.prepare.outputs.commit }}
      application-version: ${{ needs.prepare.outputs.version }}
    permissions:
      contents: read
      pages: write
      id-token: write
