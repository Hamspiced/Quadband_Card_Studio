name: Build and test
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      build-ref:
        type: string
        default: ''
      release-tag:
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: build-${{ github.workflow }}-${{ inputs.build-ref || github.ref }}
  cancel-in-progress: ${{ inputs.release-tag == '' && github.event_name != 'release' }}
defaults:
  run:
    shell: bash
jobs:
  bridge-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.build-ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Validate checked-out metadata
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
          BUILD_REF: ${{ inputs.build-ref }}
        run: |
          args=()
          if [ -n "$RELEASE_TAG" ]; then args+=(--commit "$BUILD_REF"); fi
          python scripts/release_metadata.py --release-tag="$RELEASE_TAG" "${args[@]}" --json
      - run: python -m unittest discover -s tests_release -p 'test_*.py' -v
      - run: python -m unittest discover -s protocol -p 'test_*.py' -v
      - run: python firmware/cores3/tests/run.py
      - run: python firmware/cores3/tests/ui_run.py
      - run: python firmware/cores3/tests/standalone_run.py
      - run: python -m unittest discover -s firmware/cores3/tests -p 'test_web_export.py' -v
  webflasher:
    needs: bridge-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.build-ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webflasher/package-lock.json
      - name: Install locked browser dependencies
        working-directory: webflasher
        run: npm ci
      - name: Check dependency vulnerabilities
        working-directory: webflasher
        run: npm audit --audit-level=high
      - name: Test flash policy and build installer
        working-directory: webflasher
        run: |
          npm test
          npm run build
          npx playwright install --with-deps chromium
          npm run test:browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: Quadband-Webflasher-checks
          path: webflasher/test-results/
          if-no-files-found: ignore
          retention-days: 7
  cores3-firmware:
    needs: bridge-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    container: espressif/idf:v5.5.3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.build-ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Read release metadata
        id: metadata
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: python3 scripts/release_metadata.py --release-tag="$RELEASE_TAG" --json --github-output "$GITHUB_OUTPUT"
      - name: Build locked CoreS3 firmware without flashing
        run: |
          . /opt/esp/idf/export.sh
          python3 firmware/cores3/build.py
      - name: Export clean release web payload
        if: inputs.release-tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
          APP_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          python3 firmware/cores3/tools/export_web.py \
            --output .build/cores3-web-payload --release-tag="$RELEASE_TAG" \
            --commit "$(git rev-parse HEAD)" --application-version "$APP_VERSION"
      - name: Package complete firmware and notices
        env:
          FIRMWARE_NAME: ${{ steps.metadata.outputs.firmware }}
        run: |
          . /opt/esp/idf/export.sh
          python3 scripts/package-cores3.py --output "dist/$FIRMWARE_NAME"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Quadband-CoreS3-firmware
          path: |
            dist/Quadband-CoreS3-*.zip
            dist/Quadband-CoreS3-*.zip.sha256
            firmware/cores3/README.rst
            firmware/cores3/dependencies.lock
            firmware/cores3/.build/artifacts.json
            firmware/cores3/.build/idf/quadband_cores3.bin
            firmware/cores3/.build/idf/bootloader/bootloader.bin
            firmware/cores3/.build/idf/partition_table/partition-table.bin
            firmware/cores3/.build/idf/flash_args
            firmware/cores3/.build/idf/flasher_args.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: inputs.release-tag != ''
        with:
          name: Quadband-CoreS3-web-payload
          path: .build/cores3-web-payload/
          if-no-files-found: error
          retention-days: 14
  portable:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.build-ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: desktop/requirements-build.txt
      - name: Validate package version
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: python scripts/release_metadata.py --release-tag="$RELEASE_TAG" --json
      - name: Linux desktop and card-reader libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y swig libpcsclite-dev pcscd libccid libhidapi-hidraw0 libusb-1.0-0 libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0
      - run: python -m pip install -r desktop/requirements-build.txt
      - run: python -m pip install --no-deps -e ./desktop
      - run: python -m ruff check desktop/src desktop/tests
      - run: python -m pytest desktop/tests -q
        env:
          QT_QPA_PLATFORM: offscreen
      - run: python desktop/packaging/build.py
      - run: python desktop/packaging/smoke.py
      - name: Upload Windows executable folder and versioned package
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Quadband-Windows
          path: |
            desktop/dist/QuadbandCardStudio/
            desktop/dist/*.zip
          if-no-files-found: error
          retention-days: 14
      - name: Upload Linux package
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Quadband-Linux
          path: |
            desktop/dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14
  macos:
    runs-on: macos-14
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.build-ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Validate package version
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: python scripts/release_metadata.py --release-tag="$RELEASE_TAG" --json
      - run: bash scripts/test.sh
      - run: bash scripts/build-app.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Quadband-macOS
          path: dist/Quadband-Card-Studio-*-macOS-universal.zip
          if-no-files-found: error
          retention-days: 14
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.build-ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Validate source version
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: python scripts/release_metadata.py --release-tag="$RELEASE_TAG" --json
      - run: python scripts/source-archive.py
      - run: python -m pip install build && python -m build desktop
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Quadband-source-and-python
          path: |
            dist/*source.zip
            desktop/dist/*.whl
            desktop/dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14
