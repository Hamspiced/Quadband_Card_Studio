name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: desktop/requirements-build.txt
      - name: Linux desktop and card-reader libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y swig libpcsclite-dev pcscd libccid libhidapi-hidraw0 libusb-1.0-0 libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0
      - run: python -m pip install -r desktop/requirements-build.txt
      - run: python -m pip install --no-deps -e ./desktop
      - run: python -m ruff check desktop/src desktop/tests
      - run: python -m pytest desktop/tests -q
        env:
          QT_QPA_PLATFORM: offscreen
      - run: python desktop/packaging/build.py
      - run: python desktop/packaging/smoke.py
      - name: Upload native portable package
        uses: actions/upload-artifact@v4
        with:
          name: Quadband-${{ runner.os }}
          path: |
            desktop/dist/*.zip
            desktop/dist/*.tar.gz
          if-no-files-found: error
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/test.sh
      - run: bash scripts/build-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Quadband-macOS
          path: dist/Quadband-Card-Studio-macOS.zip
          if-no-files-found: error
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/source-archive.py
      - run: python -m pip install build && python -m build desktop
      - uses: actions/upload-artifact@v4
        with:
          name: Quadband-source-and-python
          path: |
            dist/*source.zip
            desktop/dist/*.whl
            desktop/dist/*.tar.gz
          if-no-files-found: error
