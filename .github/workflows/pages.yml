name: Deploy CoreS3 installer
on:
  workflow_call:
    inputs:
      release-tag:
        required: true
        type: string
      source-commit:
        required: true
        type: string
      application-version:
        required: true
        type: string
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  site:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      eligible: ${{ steps.latest.outputs.eligible }}
    steps:
      - name: Select only the current stable release
        id: latest
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        with:
          script: |
            let release;
            try {
              release = (await github.rest.repos.getLatestRelease(context.repo)).data;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const eligible = !!release && !release.draft && !release.prerelease &&
              release.tag_name === process.env.RELEASE_TAG;
            core.setOutput("eligible", eligible ? "true" : "false");
            if (!eligible) core.notice("Skipping installer deployment: this is not the latest stable release.");
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.latest.outputs.eligible == 'true'
        with:
          ref: ${{ inputs.source-commit }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.latest.outputs.eligible == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webflasher/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        if: steps.latest.outputs.eligible == 'true'
        with:
          python-version: '3.12'
      - name: Build the tagged installer
        if: steps.latest.outputs.eligible == 'true'
        working-directory: webflasher
        run: |
          npm ci
          npm test
          npm run build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.latest.outputs.eligible == 'true'
        with:
          name: Quadband-CoreS3-web-payload
          path: .build/pages-payload
      - name: Verify clean release identity and stage matching firmware
        if: steps.latest.outputs.eligible == 'true'
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
          SOURCE_COMMIT: ${{ inputs.source-commit }}
          APP_VERSION: ${{ inputs.application-version }}
        run: |
          python scripts/prepare_pages.py --payload .build/pages-payload --site webflasher/dist \
            --tag="$RELEASE_TAG" --commit "$SOURCE_COMMIT" --version "$APP_VERSION"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: steps.latest.outputs.eligible == 'true'
        with:
          path: webflasher/dist
  deploy:
    needs: site
    if: needs.site.outputs.eligible == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Prevent an older queued run from replacing a newer release
        id: current
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        with:
          script: |
            const release = (await github.rest.repos.getLatestRelease(context.repo)).data;
            const eligible = !release.draft && !release.prerelease &&
              release.tag_name === process.env.RELEASE_TAG;
            core.setOutput("eligible", eligible ? "true" : "false");
            if (!eligible) core.notice("A newer stable release exists; this installer will not be deployed.");
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: steps.current.outputs.eligible == 'true'
      - name: Deploy verified site and split firmware
        id: deployment
        if: steps.current.outputs.eligible == 'true'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
