name: Deploy CoreS3 installer
on:
  workflow_call:
    inputs:
      release-tag:
        required: true
        type: string
      source-commit:
        required: true
        type: string
      application-version:
        required: true
        type: string
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  site:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      eligible: ${{ steps.latest.outputs.eligible }}
    steps:
      - name: Select only the current stable release
        id: latest
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        with:
          script: |
            let release;
            try {
              release = (await github.rest.repos.getLatestRelease(context.repo)).data;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const eligible = !!release && !release.draft && !release.prerelease &&
              release.tag_name === process.env.RELEASE_TAG;
            core.setOutput("eligible", eligible ? "true" : "false");
            if (!eligible) core.notice("Skipping installer deployment: this is not the latest stable release.");
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.latest.outputs.eligible == 'true'
        with:
          ref: ${{ inputs.source-commit }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.latest.outputs.eligible == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webflasher/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        if: steps.latest.outputs.eligible == 'true'
        with:
          python-version: '3.12'
      - name: Build the tagged installer
        if: steps.latest.outputs.eligible == 'true'
        working-directory: webflasher
        run: |
          npm ci
          npm test
          npm run build
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: steps.latest.outputs.eligible == 'true'
        with:
          name: Quadband-CoreS3-web-payload
          path: .build/pages-payload
      - name: Verify clean release identity and stage matching firmware
        if: steps.latest.outputs.eligible == 'true'
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
          SOURCE_COMMIT: ${{ inputs.source-commit }}
          APP_VERSION: ${{ inputs.application-version }}
        run: |
          python scripts/prepare_pages.py --payload .build/pages-payload --site webflasher/dist \
            --tag="$RELEASE_TAG" --commit "$SOURCE_COMMIT" --version "$APP_VERSION"
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        if: steps.latest.outputs.eligible == 'true'
        with:
          path: webflasher/dist
  deploy:
    needs: site
    if: needs.site.outputs.eligible == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Prevent an older queued run from replacing a newer release
        id: current
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        with:
          script: |
            const release = (await github.rest.repos.getLatestRelease(context.repo)).data;
            const eligible = !release.draft && !release.prerelease &&
              release.tag_name === process.env.RELEASE_TAG;
            core.setOutput("eligible", eligible ? "true" : "false");
            if (!eligible) core.notice("A newer stable release exists; this installer will not be deployed.");
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        if: steps.current.outputs.eligible == 'true'
      - name: Deploy verified site and split firmware
        id: deployment
        if: steps.current.outputs.eligible == 'true'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
